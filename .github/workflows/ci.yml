name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Test
        run: pytest -q

  retrieval:
    # Real embedder + Chroma: builds the index and runs the smoke tests + the
    # retrieval eval. Heavier (downloads the embedding model) so it only runs on
    # push to main, not every PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "sentence-transformers>=3.3,<4" "chromadb>=0.5.5,<0.6" \
            "einops>=0.8,<0.9" "transformers>=4.46,<5" "sentencepiece>=0.2,<0.3" \
            "trl>=0.13,<0.14" "peft>=0.13,<0.15" "accelerate>=1.0,<2" "datasets>=3.0,<4"
          pip install --no-deps -e .
      - name: Build index
        run: python -m app.ingestion.cli --rebuild
      - name: Smoke tests (retrieval + NLI; generation smoke needs a GGUF -> local only)
        run: pytest -q -m "smoke and not slow"
      - name: RLHF + DPO + compare tests (no GGUF needed)
        run: pytest -q tests/test_rlhf.py tests/test_generation_backends.py tests/test_compare.py
      - name: Retrieval eval (must clear a floor)
        run: |
          python -m app.eval.run_eval --stage retrieval
          python - <<'PY'
          import glob, json
          j = json.load(open(sorted(glob.glob("data/eval/retrieval-*-boosts.json"))[-1]))
          h6 = j["summary"]["file_hit_at_k"]["6"]
          c6 = j["summary"]["chunk_hit_at_k"]["6"]
          print(f"file hit@6={h6:.3f} chunk hit@6={c6:.3f}")
          assert h6 >= 0.95, f"file hit@6 regressed: {h6}"
          assert c6 >= 0.85, f"chunk hit@6 regressed: {c6}"
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional: if the repo sets an HF_TOKEN Actions secret, the tuned GGUF
          # is baked too. Absent, the build step is a no-op (mount required=false).
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
