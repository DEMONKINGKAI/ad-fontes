# Local development. Mirrors the Hugging Face Space, but maps to :8000 and
# mounts the index/feedback dirs so a rebuilt index and collected feedback
# survive `docker compose down`.
services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:7860"
    environment:
      AD_FONTES_PORT: "7860"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}"
      HF_TOKEN: "${HF_TOKEN:-}"
      AD_FONTES_DEFAULT_MODEL: "${AD_FONTES_DEFAULT_MODEL:-tuned}"
      AD_FONTES_LOG_LEVEL: "${AD_FONTES_LOG_LEVEL:-INFO}"
      AD_FONTES_LOCAL_TIMEOUT_S: "${AD_FONTES_LOCAL_TIMEOUT_S:-25}"
      AD_FONTES_FEEDBACK_DATASET: "${AD_FONTES_FEEDBACK_DATASET:-}"
    volumes:
      - ./data/index:/app/data/index
      - ./data/feedback:/app/data/feedback
      - model-cache:/app/data/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 150s

volumes:
  model-cache:
