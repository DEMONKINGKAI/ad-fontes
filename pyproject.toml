[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-fontes"
version = "0.1.0"
description = "Recruiter-facing RAG assistant over Kai Sharma's portfolio, with per-claim verification and a DPO-tuned faithful generator."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Archit (Kai) Sharma", email = "sharmarchit.work@gmail.com" }]

# Runtime dependencies. Deployment target is Python 3.11 on a CPU-only Hugging
# Face Space; nothing here may require a GPU or a network service at import time.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-frontmatter>=1.1,<2",
    "httpx>=0.27,<0.28",
    "chromadb>=0.5.5,<0.6",
    "sentence-transformers>=3.3,<4",
    "einops>=0.8,<0.9",                 # required by nomic-embed-text remote code
    "transformers>=4.46,<5",
    "sentencepiece>=0.2,<0.3",          # DeBERTa-v3 NLI tokenizer (else all-neutral)
    "torch>=2.2,<3",
    "llama-cpp-python>=0.3.2,<0.4",
    "huggingface-hub>=0.26,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Preference-data pipeline + evaluation (Phases 3 and 5). Kept out of the serving
# image to keep it small.
rlhf = [
    "datasets>=3.0,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "pre-commit>=4.0,<5",
]

[project.scripts]
ad-fontes-ingest = "app.ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["*.ipynb", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PL", "RUF"]
ignore = [
    "PLR0913",  # many-argument functions are fine for pipeline stages
    "PLR2004",  # magic values are common and readable in tests / thresholds
    "RUF001",   # the breadcrumb separator '›' is intentional (matches the corpus)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"app/generation/prompts.py" = ["E501"]  # prompt/example text; wrapping would change it
"app/eval/generation.py" = ["E501"]     # markdown report tables read better unwrapped
"app/rlhf/*.py" = ["E501", "PLR0912"]   # prompt/template text; long branch-per-type functions

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends()/Query()/... in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "smoke: real-model regression checks; skipped without deps + a built index",
    "slow: real generation (loads a GGUF + runs it); minutes, not seconds",
]

[tool.ad_fontes]
# Single source of truth for the corpus version string surfaced by /api/health.
# Bump when the corpus content changes.
corpus_version = "2026-09-05"
